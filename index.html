<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AcartZ Login</title>
  <link rel="stylesheet" href="st.css">
</head>
<body>

<div class="main-container">

  <div class="logo">
    <span class="orange">A</span>cart<span class="orange">Z</span>
  </div>

  <div class="card">

    <div class="form-box">

      <h2>Sign in to your Account</h2>

      <div class="input-group">
        <label>Email / Username:</label>
        <input type="text" placeholder="Enter your Email or Name">
      </div>

      <div class="input-group">
        <label>Password:</label>
        <input type="password" placeholder="Enter your Password">
      </div>

      <a href="forgot.html" class="forgot">Forgot Password?</a>

      <div class="toggle-buttons">

    <input type="radio" id="customer" name="role" checked>
    <label for="customer">Customer</label>

    <input type="radio" id="vendor" name="role">
    <label for="vendor">Vendor</label>

</div>

      <button class="login-btn">Login</button>

      <p class="bottom-text">
        Don't have an account?
        <a href="register.html">Register</a>
      </p>

    </div>

  </div>

</div>

</body>
</html>
