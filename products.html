<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Products</title>

  <link rel="stylesheet" href="../css/styling.css">

  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<div class="products-page">

  <div class="products-header">

      <h2>Products Management</h2>

      <button class="add-product-btn">
        <i class="fa-solid fa-plus"></i>
        Add Product
      </button>

  </div>

  <div class="product-table-container">

      <table>

          <thead>

              <tr>
                  <th>Image</th>
                  <th>Product Name</th>
                  <th>Category</th>
                  <th>Price</th>
                  <th>Stock</th>
                  <th>Action</th>
              </tr>

          </thead>

          <tbody>

              <tr>

                  <td>
                    <img src="../assets/images/mouse.webp" alt="Wireless Mouse">
                  </td>

                  <td>Wireless Mouse</td>

                  <td>Electronics</td>

                  <td>₹1200</td>

                  <td>85</td>

                  <td>

                    <button class="edit-btn">
                      Edit
                    </button>

                    <button class="delete-btn">
                      Delete
                    </button>

                  </td>

              </tr>

              <tr>

                  <td>
                    <img src="../assets/images/JLab.jpg" alt="Jlab Go Wireless Keyboard">
                  </td>

                  <td>Keyboard</td>

                  <td>Electronics</td>

                  <td>₹2400</td>

                  <td>30</td>

                  <td>

                    <button class="edit-btn">
                      Edit
                    </button>

                    <button class="delete-btn">
                      Delete
                    </button>

                  </td>

              </tr>
              <tr>
                <td>
                    <img src="../assets/images/watch.jpg" alt="BOAT StormCall">
                </td>
                <td>BOAT StormCall</td>
                <td>Electronics</td>
                <td>₹1500</td>
                <td>50</td>
                <td>
                    <button class="edit-btn">
                      Edit
                    </button>
                    <button class="delete-btn">
                      Delete
                    </button>
                </td>
              </tr>
              <tr>
                <td>
                    <img src="../assets/images/buds.webp" alt="Oneplus NordBuds 3r Tws">
                </td>
                <td>Oneplus NordBuds 3r Tws</td>
                <td>Electronics</td>
                <td>₹2500</td>
                <td>25</td>
                <td>
                    <button class="edit-btn">
                      Edit
                    </button>
                    <button class="delete-btn">
                      Delete
                    </button>
                </td>
              </tr>

          </tbody>

      </table>

  </div>

</div>


</body>
</html>
