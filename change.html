<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Password Change</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main class="main-container">

            <h1 class="logo">

            <span class="orange">A</span>cart<span class="orange">Z</span>

        </h1>

        <div class="card">

            <div class="overlay"></div>

            <div class="form-box">

                <h2>Password Change</h2>

                <form action="#">

                    <div class="input-group">

                        <label for="newpassword">
                            New Password:
                        </label>

                        <input type="password" id="newpassword" placeholder="Enter your New password">

                    </div>

                    <div class="input-group">

                        <label for="confirmpassword">
                            Confirm New password:
                        </label>

                        <input type="password" id="confirmpassword" placeholder="Re Enter Your New password">

                    </div>

                    <button class="login-btn">

                        Confirm Password

                    </button>

                </form>

                <div class="links">

                    <p>
                        Don't have an account?
                        <a href="register.html">Register</a>
                    </p>

                    <p>
                        Have an account?
                        <a href="index.html">Login</a>
                    </p>

                </div>

            </div>

        </div>

    </main>

</body>

</html>
